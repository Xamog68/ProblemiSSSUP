name: Pubblica il sito ProblemiSSSUP

on:
  push:
    branches: [main]
    paths:
      - 'sito/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Carica la cartella sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./sito
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
